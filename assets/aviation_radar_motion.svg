<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'SF Mono', Monaco, 'Courier New', monospace;">
  <defs>
    <!-- Sweep gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#00b4d8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#03045e" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .radar-sweep {
      transform-origin: 125px 120px;
      animation: rotateSweep 6s linear infinite;
    }
    @keyframes rotateSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .blip-pulse {
      animation: blipGlow 2s ease-in-out infinite alternate;
    }
    @keyframes blipGlow {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.15); }
    }
    .dash-line {
      stroke-dasharray: 4 4;
      animation: dashMove 20s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    .flight-tag { font-size: 10px; font-weight: bold; fill: #00ffcc; letter-spacing: 0.5px; }
    .flight-sub { font-size: 9px; fill: #798eab; }
    .hud-title { font-size: 13px; font-weight: bold; fill: #38bdf8; letter-spacing: 1px; }
    .hud-label { font-size: 11px; fill: #94a3b8; font-weight: 500; }
    .hud-val { font-size: 11px; font-weight: bold; }
  </style>

  <!-- Border Card -->
  <rect x="2" y="2" width="846" height="236" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.2"/>

  <!-- ================= RADAR DISPLAY (LEFT) ================= -->
  <!-- Concentric Rings -->
  <circle cx="125" cy="120" r="95" fill="none" stroke="#1e3a5f" stroke-width="1.2"/>
  <circle cx="125" cy="120" r="66.5" fill="none" stroke="#172e48" stroke-width="1"/>
  <circle cx="125" cy="120" r="38.0" fill="none" stroke="#172e48" stroke-width="1"/>
  <circle cx="125" cy="120" r="9.5" fill="#00ffcc" opacity="0.4"/>

  <!-- Crosshairs -->
  <line x1="30" y1="120" x2="220" y2="120" stroke="#172e48" stroke-width="1"/>
  <line x1="125" y1="25" x2="125" y2="215" stroke="#172e48" stroke-width="1"/>
  
  <!-- Outer Compass Markings -->
  <text x="122" y="21" font-size="8" fill="#64748b" font-weight="bold">N</text>
  <text x="224" y="123" font-size="8" fill="#64748b" font-weight="bold">E</text>
  <text x="122" y="225" font-size="8" fill="#64748b" font-weight="bold">S</text>
  <text x="20" y="123" font-size="8" fill="#64748b" font-weight="bold">W</text>

  <!-- Rotating Sweep Beam -->
  <g class="radar-sweep">
    <path d="M 125 120 L 220 120 A 95 95 0 0 0 206.7 72.5 Z" fill="url(#radarSweep)"/>
    <line x1="125" y1="120" x2="220" y2="120" stroke="#00ffcc" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Aircraft Blip 1 (AI-101) -->
  <g class="blip-pulse" transform="translate(167, 85)">
    <circle cx="0" cy="0" r="4" fill="#00ffcc" filter="url(#cyanGlow)"/>
    <polygon points="0,-4 3,3 0,1 -3,3" fill="#ffffff" transform="rotate(45)"/>
    <text x="8" y="-4" class="flight-tag">AI-101</text>
    <text x="8" y="7" class="flight-sub">DEL ✈ BOM • FL380</text>
  </g>

  <!-- Aircraft Blip 2 (6E-204) -->
  <g class="blip-pulse" transform="translate(77, 158)">
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8" filter="url(#cyanGlow)"/>
    <polygon points="0,-3 2.5,2 0,1 -2.5,2" fill="#ffffff" transform="rotate(135)"/>
    <text x="8" y="-3" class="flight-tag" fill="#38bdf8">6E-204</text>
    <text x="8" y="7" class="flight-sub">HYD ✈ BLR • FL320</text>
  </g>

  <!-- ================= TELEMETRY & SYSTEM RADAR HUD (RIGHT) ================= -->
  <g transform="translate(250, 32)">
    <!-- Header -->
    <text x="0" y="0" class="hud-title">📡 HORIZON TELEMETRY: GROUND TO AIRSPACE INTELLIGENCE</text>
    <text x="0" y="18" font-size="11" fill="#64748b">Research &amp; Engineering Trajectory: Desktop Agents ➔ Rail Transit ➔ Autonomous Aviation</text>

    <!-- Separation line -->
    <line x1="0" y1="28" x2="570" y2="28" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 1: The Origin (Past) -->
    <g transform="translate(0, 48)">
      <circle cx="6" cy="6" r="4" fill="#475569"/>
      <text x="18" y="9" class="hud-label">ORIGIN [PAST]:</text>
      <text x="135" y="9" class="hud-val" fill="#94a3b8">🐺 WOLF-AI</text>
      <text x="235" y="9" font-size="11" fill="#64748b">Autonomous Desktop Voice &amp; Task Agent</text>
      <rect x="500" y="-3" width="70" height="18" rx="3" fill="#1e293b"/>
      <text x="510" y="9" font-size="9" font-weight="bold" fill="#94a3b8">ARCHIVED</text>
    </g>

    <!-- Row 2: The Flagship (Current) -->
    <g transform="translate(0, 80)">
      <circle cx="6" cy="6" r="4" fill="#22c55e"/>
      <text x="18" y="9" class="hud-label">FLAGSHIP [CURRENT]:</text>
      <text x="135" y="9" class="hud-val" fill="#22c55e">🚆 SCHEDURA</text>
      <text x="235" y="9" font-size="11" fill="#64748b">Offline Smart Travel &amp; On-Device NLP Engine</text>
      <rect x="500" y="-3" width="70" height="18" rx="3" fill="#052e16" stroke="#22c55e" stroke-width="0.8"/>
      <text x="513" y="9" font-size="9" font-weight="bold" fill="#22c55e">SHIPPED</text>
    </g>

    <!-- Row 3: The Upcoming Horizon (Future) -->
    <g transform="translate(0, 112)">
      <circle cx="6" cy="6" r="4" fill="#00ffcc">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="18" y="9" class="hud-label">HORIZON [UPCOMING]:</text>
      <text x="135" y="9" class="hud-val" fill="#00ffcc">✈️ AERO-INTELLIGENCE</text>
      <text x="285" y="9" font-size="11" fill="#cbd5e1">Flight Telemetry, Great-Circle Trajectory &amp; ADS-B Analytics</text>
      <rect x="500" y="-3" width="70" height="18" rx="3" fill="#082f49" stroke="#00ffcc" stroke-width="0.8"/>
      <text x="506" y="9" font-size="9" font-weight="bold" fill="#00ffcc">IN FLIGHT</text>
    </g>

    <!-- Bottom Telemetry Live Ticker -->
    <g transform="translate(0, 155)">
      <rect width="570" height="24" rx="4" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="16" font-size="10" font-weight="bold" fill="#38bdf8">ADS-B STATUS:</text>
      <text x="105" y="16" font-size="10" fill="#94a3b8">Active Radar Tracking • Mach 0.82 • Geodesic Routing • Offline Flight Deck Ready</text>
    </g>
  </g>
</svg>
